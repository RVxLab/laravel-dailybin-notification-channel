name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prefer-flag: ['prefer-stable', 'prefer-lowest']
        include:
          # Laravel 12 / testbench v10 — PHP 8.2–8.5
          - php: '8.2'
            testbench: '^10.0'
            laravel: '12'
          - php: '8.3'
            testbench: '^10.0'
            laravel: '12'
          - php: '8.4'
            testbench: '^10.0'
            laravel: '12'
          - php: '8.5'
            testbench: '^10.0'
            laravel: '12'
          # Laravel 13 / testbench v11 — PHP 8.3–8.5
          - php: '8.3'
            testbench: '^11.0'
            laravel: '13'
          - php: '8.4'
            testbench: '^11.0'
            laravel: '13'
          - php: '8.5'
            testbench: '^11.0'
            laravel: '13'

    name: "L${{ matrix.laravel }} / PHP ${{ matrix.php }} / ${{ matrix.prefer-flag }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ matrix.testbench }}-${{ matrix.prefer-flag }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ matrix.php }}-${{ matrix.testbench }}-${{ matrix.prefer-flag }}-

      - name: Install dependencies
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer update --${{ matrix.prefer-flag }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --ci